name: Deploy free Web to Hong Kong origin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-hk
  cancel-in-progress: false

jobs:
  deploy:
    environment: production-hk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TT16_SITE_URL: ${{ secrets.TT16_SITE_URL }}
      TT16_ANALYTICS_ENDPOINT: ${{ secrets.TT16_ANALYTICS_ENDPOINT }}
      TT16_ADS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build immutable static release
        run: |
          case "$TT16_SITE_URL" in
            https://*) ;;
            *) echo "TT16_SITE_URL must be an HTTPS canonical URL" >&2; exit 64 ;;
          esac
          npm ci
          npm run build
          npm run test:web-build
          tar --create --gzip --file "/tmp/tt16-${GITHUB_SHA}.tar.gz" --directory dist/web .

      - name: Configure pinned SSH host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TT16_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TT16_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Upload versioned release
        env:
          SSH_HOST: ${{ secrets.TT16_SSH_HOST }}
          SSH_PORT: ${{ secrets.TT16_SSH_PORT }}
          SSH_USER: ${{ secrets.TT16_SSH_USER }}
        run: scp -P "$SSH_PORT" "/tmp/tt16-${GITHUB_SHA}.tar.gz" "${SSH_USER}@${SSH_HOST}:/srv/tt16/incoming/${GITHUB_SHA}.tar.gz"

      - name: Atomically activate release
        env:
          SSH_HOST: ${{ secrets.TT16_SSH_HOST }}
          SSH_PORT: ${{ secrets.TT16_SSH_PORT }}
          SSH_USER: ${{ secrets.TT16_SSH_USER }}
        run: ssh -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "/usr/local/bin/tt16-release '${GITHUB_SHA}' '/srv/tt16/incoming/${GITHUB_SHA}.tar.gz'"

      - name: Verify public HTTPS and canonical
        run: |
          tt16_site_base="${TT16_SITE_URL%/}/"
          curl --fail --silent --show-error --location "${tt16_site_base}healthz"
          curl --fail --silent --show-error "$tt16_site_base" | grep -F "<link rel=\"canonical\" href=\"${tt16_site_base}\""
