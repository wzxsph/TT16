name: Free growth v2 quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-growth-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type checks
        run: npm run typecheck

      - name: Core and content tests
        run: |
          npm test -- --run
          npm run test:content

      - name: Build and verify canonical Web edition
        run: |
          npm run build
          npm run test:web-build

      - name: Build and verify GitHub Pages mirror
        run: |
          npm run build:pages
          npm run test:pages-build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and 390px browser flows
        run: npm run test:e2e

      - name: Retired host, links and dependency audit
        run: |
          npm run test:retired-sandbox
          npm run test:links
          npm audit --audit-level=high
          git diff --check

  wechat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build WeChat mini program
        run: npm run build:weapp

      - name: Verify package boundary and sensitive strings
        run: npm run test:weapp-build

      - name: High-severity dependency audit
        run: npm audit --audit-level=high
