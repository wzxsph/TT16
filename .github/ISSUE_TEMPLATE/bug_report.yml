name: Bug 报告
description: 报告可以稳定复现的 Web、小程序、内容或构建问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴答题数据、人格结果、真实 AppID、广告位 ID、密钥、服务器信息或尚未修复的安全漏洞。
  - type: dropdown
    id: surface
    attributes:
      label: 问题区域
      options:
        - Web 首页 / 公开内容
        - Web 答题 / 本地恢复 / 报告
        - 分享卡 / Open Graph / A4 打印
        - 中性对照 / 复盘工具
        - 微信小程序
        - 共享核心 / 计分 / 内容
        - 构建 / 测试 / 部署 / 退休入口
        - 文档 / 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际发生了什么？
      description: 描述可见现象，不要包含秘密或真实用户数据。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 例如 GitHub Pages / 本地 / 微信开发者工具，浏览器或基础库版本，桌面或约 390px 移动端。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的截图或日志
      description: 可选；请先遮盖答案、结果、AppID、广告位 ID、邮箱、IP 和账户信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
        - label: 内容不含答案、私人结果、AppID、密钥、服务器配置或个人信息。
          required: true
