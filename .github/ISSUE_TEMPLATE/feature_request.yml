name: 功能建议
description: 提议符合 TT16 产品边界的新能力或体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 从用户场景和当前阻碍开始，而不是只描述一个按钮或技术方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明主要流程、边界和完成标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过哪些替代方案？
  - type: dropdown
    id: data
    attributes:
      label: 是否需要新增数据？
      options:
        - 不需要
        - 仅新增匿名、白名单事件字段
        - 需要新增 D1 数据结构
        - 不确定，需要先做隐私评估
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 建议不会把人格类型解释成投资能力或收益预测。
          required: true
        - label: 建议不会要求券商账号、持仓、收入、负债或真实支付资料。
          required: true
        - label: 建议不会在付费前泄露人格结果。
          required: true
